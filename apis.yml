description: >-
  Tia is a modern women's healthcare provider offering a hybrid in-person and
  virtual care model. Services span primary care, sexual and gynecological
  health, mental health, dermatology, acupuncture, perimenopause and
  menopause care, and weight management and metabolic health. Tia operates
  in-person clinics in Los Angeles (Culver City, Pasadena, Playa Vista,
  Silver Lake, Studio City, West Hollywood), Scottsdale (AZ), San Francisco
  (CA), and New York (Soho, Williamsburg), and supports virtual visits across
  served states. Pricing combines a Tia Membership ($25/mo or $240/yr) with a
  pay-as-you-go Tia Essential option; most major PPOs are accepted. Tia is
  primarily a consumer healthcare service; no public developer or partner API
  has been identified. This entry catalogs the company surface for the API
  Evangelist index.
